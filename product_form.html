{% extends "base.html" %}
{% block title %}{{ 'Edit' if product else 'Add' }} product | Stock Manager{% endblock %}
{% block content %}
<div class="mb-4"><h1 class="h3">{{ 'Edit product' if product else 'Add product' }}</h1><p class="text-secondary">Enter product details below.</p></div>
<form method="post" class="panel form-panel">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Product name *</label><input class="form-control" name="name" required value="{{ product.name if product else '' }}"></div>
    <div class="col-md-6"><label class="form-label">SKU / code *</label><input class="form-control" name="sku" required value="{{ product.sku if product else '' }}"></div>
    <div class="col-md-6"><label class="form-label">Category</label><input class="form-control" name="category" value="{{ product.category if product else 'General' }}"></div>
    <div class="col-md-6"><label class="form-label">Quantity *</label><input class="form-control" type="number" min="0" name="quantity" required value="{{ product.quantity if product else 0 }}"></div>
    <div class="col-md-6"><label class="form-label">Unit price (₹) *</label><input class="form-control" type="number" min="0" step="0.01" name="price" required value="{{ product.price if product else 0 }}"></div>
    <div class="col-md-6"><label class="form-label">Low-stock threshold</label><input class="form-control" type="number" min="0" name="reorder_level" value="{{ product.reorder_level if product else 5 }}"></div>
  </div>
  <div class="mt-4 d-flex gap-2"><button class="btn btn-primary">Save product</button><a class="btn btn-outline-secondary" href="{{ url_for('products') }}">Cancel</a></div>
</form>
{% endblock %}
